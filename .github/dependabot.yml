# Opens PRs for outdated dependencies so a security patch like the Next.js
# 16.2.9 proxy auth-bypass advisory surfaces on its own instead of waiting for
# somebody to run `npm audit` by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are the routine ones; batching them keeps the PR
      # list short. Majors still arrive as individual PRs worth reading.
      routine:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 crashes eslint-plugin-react 7.37 (react/display-name:
      # "getFilename is not a function"), and eslint-config-next 16.3 still
      # pins that plugin line — PR #40 failed on exactly this, 2026-08-23 and
      # again on 2026-09-05 with 16.3.4. Lift once eslint-config-next's
      # changelog says ESLint 10.
      - dependency-name: eslint
        versions: [">=10"]

  # The workflow's own actions go stale too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
