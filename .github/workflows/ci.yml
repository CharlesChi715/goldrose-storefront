# Runs on every push and pull request so each commit gets a visible green or
# red mark. Next 16 removed lint-on-build, so without this workflow `npm run
# lint` only ever runs when somebody remembers to type it.
#
# Deliberately NOT here yet:
#   * `npm run test:e2e` — the pixel baselines in tests/e2e/__screenshots__ are
#     named `-darwin.png`; on a Linux runner every pixel spec fails. Adding e2e
#     means a macos-latest runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      # Fails when feature front matter / roadmap.legacy.yaml disagree with the
      # generated roadmap block in docs/features/README.md.
      - run: npm run features:check
      # `next build` prerenders pages that read .data/db.json in local mode,
      # and that directory is gitignored — seed it first.
      - run: npm run seed -- --reset
      - run: npm run build
