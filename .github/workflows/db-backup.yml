# WHY THIS EXISTS
# Supabase's own daily backups are a paid feature and this project is on the
# free tier, so the live database — the one that will hold real orders and real
# customers — has no backup at all. Losing it today costs a seed script; losing
# it after the first real order costs orders and customers that cannot be
# reconstructed from anything.
#
# Plan, status and known gaps: docs/features/db-backups.md
name: Database backup

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to run half-configured
        env:
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          DB_HOST: ${{ vars.BACKUP_PGHOST }}
          DB_USER: ${{ vars.BACKUP_PGUSER }}
        run: |
          missing=""
          [ -n "$PGPASSWORD" ] || missing="$missing BACKUP_PGPASSWORD"
          [ -n "$ROLE" ] || missing="$missing AWS_ROLE_ARN"
          [ -n "$BUCKET" ] || missing="$missing S3_BUCKET"
          [ -n "$DB_HOST" ] || missing="$missing BACKUP_PGHOST"
          [ -n "$DB_USER" ] || missing="$missing BACKUP_PGUSER"
          if [ -n "$missing" ]; then
            echo "::error::Database backup cannot run. Missing:$missing"
            exit 1
          fi

      - name: Install the PostgreSQL 17 client
        run: |
          # The runner's default client is older than the hosted server, and
          # pg_dump refuses to dump a server newer than itself. The error reads
          # like a connection problem, so pin the version rather than hope.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/pgdg.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump the database
        env:
          # The SESSION pooler (port 5432). GitHub's runners are IPv4-only and
          # Supabase's direct connection is IPv6-only, so the pooler is not a
          # preference here, it is the only route. The transaction pooler
          # (6543) cannot serve pg_dump.
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PGSSLMODE: require
          DATABASE_URL: postgresql://${{ vars.BACKUP_PGUSER }}@${{ vars.BACKUP_PGHOST }}:5432/postgres
        run: scripts/backup-db.sh "$RUNNER_TEMP/backup"

      - name: Get a one-hour AWS key card
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload to S3
        run: |
          stamp="$(date -u +%Y/%m/%Y-%m-%dT%H%MZ)"
          for file in public.dump platform.dump schema.sql; do
            echo "db/$stamp/$file"
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "db/$stamp/$file" \
              --body "$RUNNER_TEMP/backup/$file" \
              --query VersionId --output text
          done

      - name: Say what happened
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Backup uploaded. Remember: it is not a backup until a restore"
            echo "has been rehearsed — docs/runbooks/restore-from-backup.md"
          else
            echo "::error::The nightly database backup FAILED. The live database"
            echo "::error::may now have no recent copy. See docs/runbooks/restore-from-backup.md"
          fi
