# record (a new decision, new work), scaffold it with `npm run features:new`,
# move anything worth keeping, and DELETE its entry here.
# After any edit run `npm run features:generate` (CI fails on a stale roadmap).
# Fields: id, title, parent (group id), order, delivery, rollout (optional when
# dropped), qualifier (only when the bare status would mislead / names the blocker).

